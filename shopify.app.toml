# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "457df6d0bce3949edd664f9f4cf57540"
name = "Form Builder"
application_url = "https://forms.klaxon.app/shopify/auth"
embedded = true

[app_proxy]
url = "https://forms.klaxon.app/shopify/webhooks"
subpath = "shopify"
prefix = "apps"

[pos]
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_resource_feedbacks,read_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://forms.klaxon.app/shopify/auth",
  "https://forms.klaxon.app/"
]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://forms.klaxon.app/shopify/webhooks/compliance"
